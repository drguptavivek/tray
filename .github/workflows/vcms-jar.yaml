name: vcms-jar

# Builds only qz-tray.jar from this fork. Install upstream's signed QZ Tray, then swap this jar in
# (vcms/install-vcms-jar.ps1). Windows Smart App Control only checks .exe/.dll, which stay upstream-signed.
# Runs only by hand (Actions > vcms-jar > Run workflow) or when a release tag is pushed, e.g.
#   git tag v2.3.0-vcms.1 && git push origin v2.3.0-vcms.1
# A tag run also publishes a GitHub release with the zip, jar and signed DMGs attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'liberica'
      - run: ant distribute
      - run: sha256sum out/dist/qz-tray.jar | tee out/dist/qz-tray.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qz-tray-vcms-jar
          path: |
            out/dist/qz-tray.jar
            out/dist/qz-tray.jar.sha256
            vcms/install-vcms-jar.ps1

  windows-swap:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: qz-tray-vcms-jar
          path: dl
      - shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/qzind/tray/releases/download/v2.3.0/qz-tray-2.3.0-x86_64.exe -OutFile up.exe
          $s = Get-AuthenticodeSignature up.exe; "$($s.Status) $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw 'upstream installer signature not valid' }
          Start-Process -Wait .\up.exe -ArgumentList '/S'
          # Upstream runtime DLLs should be signed
          Get-ChildItem 'C:/Program Files/QZ Tray/runtime/bin' -Filter *.dll | Where-Object { $_.Name -in 'zip.dll','java.dll' } | ForEach-Object { "$($_.Name) $((Get-AuthenticodeSignature $_).Status)" }
          .\vcms\install-vcms-jar.ps1 -Jar (Get-ChildItem dl -Recurse -Filter qz-tray.jar).FullName
          $v = $null
          foreach ($i in 1..30) { Start-Sleep 2; try { $v = (Invoke-WebRequest http://localhost:8182/ -UseBasicParsing).Content; break } catch {} }
          if ($v -notmatch '<td>version</td>\s*<td>2\.3\.0</td>') { throw "About page did not report version 2.3.0: $v" }
          'OK: upstream-signed QZ Tray running the VCMS jar'

  portable-zip:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: qz-tray-vcms-jar
          path: dl
      - shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/qzind/tray/releases/download/v2.3.0/qz-tray-2.3.0-x86_64.exe -OutFile up.exe
          if ((Get-AuthenticodeSignature up.exe).Status -ne 'Valid') { throw 'upstream installer signature not valid' }
          7z x up.exe -oex -y | Select-Object -Last 3
          # the installer's files live in $PLUGINSDIR/payload
          Move-Item "ex/`$PLUGINSDIR/payload" qz-tray
          Get-ChildItem qz-tray | Format-Table Name
          Copy-Item (Get-ChildItem dl -Recurse -Filter qz-tray.jar).FullName qz-tray/qz-tray.jar -Force
          Copy-Item vcms/install-from-zip.ps1 qz-tray/
          # every exe/dll must keep a valid upstream signature
          Get-ChildItem qz-tray -Recurse -Include *.exe,*.dll | ForEach-Object { (Get-AuthenticodeSignature $_).Status } | Group-Object | Format-Table Name, Count
          Compress-Archive qz-tray/* qz-tray-vcms-2.3.0-windows-x86_64.zip
          # simulate a user: extract the zip elsewhere and run the install script
          Expand-Archive qz-tray-vcms-2.3.0-windows-x86_64.zip extracted
          .\extracted\install-from-zip.ps1 -Dest D:\qz-test
          $v = $null
          foreach ($i in 1..30) { Start-Sleep 2; try { $v = (Invoke-WebRequest http://localhost:8182/ -UseBasicParsing).Content; break } catch {} }
          if ($v -notmatch '<td>version</td>\s*<td>2\.3\.0</td>') { throw "About page missing/wrong: $v" }
          'OK: zip install works'
      - uses: actions/upload-artifact@v4
        with:
          name: qz-tray-vcms-portable
          path: qz-tray-vcms-2.3.0-windows-x86_64.zip

  # Full macOS build signed with your own Developer ID, then notarized + stapled.
  # Off until repo variable MAC_SIGNING=true and these secrets exist:
  #   MACOS_CERT_P12_BASE64  base64 of the "Developer ID Application" cert + key exported as .p12
  #   MACOS_CERT_PASSWORD    password of that .p12
  #   APPLE_TEAM_ID          10-character Team ID
  #   APPLE_ID               Apple ID email used for notarization
  #   APPLE_APP_PASSWORD     app-specific password for that Apple ID (appleid.apple.com)
  macos-dmg:
    if: ${{ vars.MAC_SIGNING == 'true' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'liberica'
      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db; KC_PASS=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KC_PASS" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KC_PASS" $KC
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" $KC > /dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12
          security find-identity -v -p codesigning $KC
      - run: npm install -g appdmg
      - run: ant -Dtarget.arch=${{ matrix.arch }} -Dapple.packager.signid=${{ secrets.APPLE_TEAM_ID }} dmg
      - name: Verify signature is ours, not ad-hoc
        run: |
          APP=$(find out -maxdepth 3 -name "*.app" -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}" || { echo "not signed with your Team ID"; exit 1; }
      - name: Notarize and staple
        run: |
          DMG=$(ls out/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: qz-tray-vcms-macos-${{ matrix.arch }}
          path: out/*.dmg

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled() }}
    needs: [jar, windows-swap, portable-zip, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "VCMS build of QZ Tray. Windows: unzip and run install-from-zip.ps1 as Administrator (upstream-signed exe/dll + VCMS jar). macOS: signed and notarized DMG." \
            $(find dist -type f \( -name '*.zip' -o -name '*.dmg' -o -name 'qz-tray.jar*' -o -name 'install-vcms-jar.ps1' \))
