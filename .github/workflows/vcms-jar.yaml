name: vcms-jar

# Builds only qz-tray.jar from this fork. Install upstream's signed QZ Tray, then swap this jar in
# (vcms/install-vcms-jar.ps1). Windows Smart App Control only checks .exe/.dll, which stay upstream-signed.
on: [push, pull_request, workflow_dispatch]

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'liberica'
      - run: ant distribute
      - run: sha256sum out/dist/qz-tray.jar | tee out/dist/qz-tray.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qz-tray-vcms-jar
          path: |
            out/dist/qz-tray.jar
            out/dist/qz-tray.jar.sha256
            vcms/install-vcms-jar.ps1

  windows-swap:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: qz-tray-vcms-jar
          path: dl
      - shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/qzind/tray/releases/download/v2.3.0/qz-tray-2.3.0-x86_64.exe -OutFile up.exe
          $s = Get-AuthenticodeSignature up.exe; "$($s.Status) $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw 'upstream installer signature not valid' }
          Start-Process -Wait .\up.exe -ArgumentList '/S'
          # Upstream runtime DLLs should be signed
          Get-ChildItem 'C:/Program Files/QZ Tray/runtime/bin' -Filter *.dll | Where-Object { $_.Name -in 'zip.dll','java.dll' } | ForEach-Object { "$($_.Name) $((Get-AuthenticodeSignature $_).Status)" }
          .\vcms\install-vcms-jar.ps1 -Jar (Get-ChildItem dl -Recurse -Filter qz-tray.jar).FullName
          $v = $null
          foreach ($i in 1..30) { Start-Sleep 2; try { $v = (Invoke-WebRequest http://localhost:8182/ -UseBasicParsing).Content; break } catch {} }
          if ($v -notmatch '<td>version</td>\s*<td>2\.3\.0</td>') { throw "About page did not report version 2.3.0: $v" }
          'OK: upstream-signed QZ Tray running the VCMS jar'
